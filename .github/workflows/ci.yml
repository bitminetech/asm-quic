# Build every target with the pinned toolchain and check each library against
# the declared interface and frame rules, generate the vectors, then on each of
# the 7 supported targets run the test runner (vectors and scenarios) and the
# shell loop test, run transport interop over quic-v1 on each Linux ISA against
# the 12 implementations of libp2p/test-plans, and write the tick tables
# (ARCHITECTURE.md sections 1, 4, 7 and 10).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - name: Build and check all targets
        run: |
          docker build -t asm-quic-build -f platform/linux/Dockerfile platform/linux
          docker run --rm -v "$PWD:/src" -w /src asm-quic-build platform/build-all.sh
      - name: Generate the vectors
        run: |
          tests/generator/run.sh "$RUNNER_TEMP/vectors"
          sudo chown -R "$(id -u):$(id -g)" build
          mkdir -p build/vectors
          cp "$RUNNER_TEMP"/vectors/*.bin build/vectors/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build
          path: |
            build/
            !build/deps/

  linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64,  runs-on: ubuntu-24.04,     qemu: "" }
          - { isa: arm64,   runs-on: ubuntu-24.04-arm, qemu: "" }
          - { isa: riscv64, runs-on: ubuntu-24.04-arm, qemu: qemu-riscv64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - if: matrix.qemu != ''
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Run the vectors, the scenarios and the shell loop test
        run: |
          set -o pipefail
          chmod +x build/linux-${{ matrix.isa }}/runner build/linux-${{ matrix.isa }}/loop
          ${{ matrix.qemu }} build/linux-${{ matrix.isa }}/runner build/vectors | tee results-linux-${{ matrix.isa }}.txt
          ${{ matrix.qemu }} build/linux-${{ matrix.isa }}/loop | tee -a results-linux-${{ matrix.isa }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-linux-${{ matrix.isa }}
          path: results-linux-${{ matrix.isa }}.txt

  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: windows-2025 }
          - { isa: arm64,  runs-on: windows-11-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - name: Run the vectors, the scenarios and the shell loop test
        shell: pwsh
        run: |
          & "build/windows-${{ matrix.isa }}/runner.exe" build/vectors | Tee-Object results-windows-${{ matrix.isa }}.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "build/windows-${{ matrix.isa }}/loop.exe" | Tee-Object -Append results-windows-${{ matrix.isa }}.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-windows-${{ matrix.isa }}
          path: results-windows-${{ matrix.isa }}.txt

  macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: macos-15-intel }
          - { isa: arm64,  runs-on: macos-15 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - name: Run the vectors, the scenarios and the shell loop test
        run: |
          set -o pipefail
          tests/runner/macos.sh build/vectors | tee results-macos-${{ matrix.isa }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-macos-${{ matrix.isa }}
          path: results-macos-${{ matrix.isa }}.txt

  # transport-interop of libp2p/test-plans over quic-v1: the node of each Linux
  # ISA against each of the 12 implementations, both directions, one job per
  # ISA and implementation. The RISC-V node runs under QEMU user mode on ARM64.
  interop:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        isa: [x86_64, arm64, riscv64]
        impl: [go-v0.46, go-v0.47, go-v0.48, rust-v0.53, rust-v0.54, rust-v0.55, rust-v0.56,
               nim-v2.4, jvm-libp2p-v1.3, python-v0.x, c-v0.0.1, eth-p2p-z-v0.0.1]
    runs-on: ${{ matrix.isa == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - name: Build the images
        run: |
          chmod +x build/linux-${{ matrix.isa }}/node
          tests/interop/build-images.sh ${{ matrix.isa }} "$RUNNER_TEMP" ${{ matrix.impl }}
      - name: Run the pairs
        run: |
          set -o pipefail
          tests/interop/run.sh ${{ matrix.isa }} ${{ matrix.impl }} | tee interop-${{ matrix.isa }}-${{ matrix.impl }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: interop-${{ matrix.isa }}-${{ matrix.impl }}
          path: interop-${{ matrix.isa }}-${{ matrix.impl }}.txt

  # Count the interop pairs of each ISA: 12 implementations, both directions,
  # so 24 must pass on each.
  interop-results:
    needs: interop
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { pattern: interop-*, path: interop, merge-multiple: true }
      - name: Count the pairs
        run: |
          status=0
          {
            echo "| ISA | Passed | Failed |"
            echo "|---|---|---|"
            for isa in x86_64 arm64 riscv64; do
              lines=$(cat interop/interop-$isa-*.txt 2>/dev/null || true)
              p=$(printf '%s\n' "$lines" | grep -c '^PASS ' || true)
              f=$(printf '%s\n' "$lines" | grep -c '^FAIL ' || true)
              echo "| $isa | $p | $f |"
              [ "$p" = 24 ] || status=1
            done
            echo
            grep -h '^FAIL ' interop/*.txt 2>/dev/null | sed 's/^/- /' || true
          } > summary.md
          cat summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

  # Write the tick tables into docs/reference/ from the results of every target.
  # On a push to main, commit them when they changed. When main has moved on,
  # the push is skipped: the newer run writes the tables then.
  results:
    needs: [build, linux, windows, macos]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { pattern: results-*, path: results, merge-multiple: true }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { name: build, path: build }
      - name: Write the tick tables
        run: python3 -I tests/runner/tick_tables.py results build
      - name: Commit the tick tables
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/reference
          if git diff --cached --quiet; then echo "The tick tables did not change."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update the tick tables"
          if ! git push origin HEAD:main; then
            [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ] || exit 1
            echo "main has moved on, so this run does not update the tick tables."
          fi
